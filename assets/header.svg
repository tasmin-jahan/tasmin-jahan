      <polygon class="star starfade" style="animation-delay:1.4s" points="810.0,57.0 812.4,62.8 818.6,63.2 813.8,67.2 815.3,73.3 810.0,70.0 804.7,73.3 806.2,67.2 801.4,63.2 807.6,62.8"/>
