      <polygon class="star starfade" style="animation-delay:3.5s" points="660.0,107.0 662.4,112.8 668.6,113.2 663.8,117.2 665.3,123.3 660.0,120.0 654.7,123.3 656.2,117.2 651.4,113.2 657.6,112.8"/>
      <polygon class="star starfade" style="animation-delay:3.8s" points="830.0,172.0 832.4,177.8 838.6,178.2 833.8,182.2 835.3,188.3 830.0,185.0 824.7,188.3 826.2,182.2 821.4,178.2 827.6,177.8"/>
    </g>
    <rect id="sweep" y="0" width="260" height="220" fill="url(#glowgrad)"/>
  </g>

  <rect x="0" y="0" width="900" height="36" rx="14" fill="#111318"/>
  <rect x="0" y="22" width="900" height="14" fill="#111318"/>
  <circle class="dot" cx="26" cy="18" r="5"/>
  <circle class="dot2" cx="44" cy="18" r="5"/>
  <circle class="dot3" cx="62" cy="18" r="5"/>
  <text x="450" y="23" text-anchor="middle" class="comment">~/tasmin-jahan — zsh</text>

  <text x="40" y="80" class="comment">$ whoami</text>

  <text x="40" y="118">
    <tspan class="prompt">&gt;</tspan>
    <tspan class="name-hollow" dx="14">Tasmin Jahan</tspan>
  </text>

  <text x="54" y="150" class="role">building things with a little more color, half <tspan class="path">logic</tspan>, half <tspan class="prompt">glitter</tspan></text>

  <text x="40" y="188" class="comment">$ <tspan class="cursor">▊</tspan></text>
</svg>
