      <polygon class="star starfade" style="animation-delay:2.1s" points="800.0,127.0 802.4,132.8 808.6,133.2 803.8,137.2 805.3,143.3 800.0,140.0 794.7,143.3 796.2,137.2 791.4,133.2 797.6,132.8"/>
      <polygon class="star starfade" style="animation-delay:2.4s" points="750.0,147.0 752.4,152.8 758.6,153.2 753.8,157.2 755.3,163.3 750.0,160.0 744.7,163.3 746.2,157.2 741.4,153.2 747.6,152.8"/>
      <polygon class="star starfade" style="animation-delay:2.8s" points="690.0,157.0 692.4,162.8 698.6,163.2 693.8,167.2 695.3,173.3 690.0,170.0 684.7,173.3 686.2,167.2 681.4,163.2 687.6,162.8"/>
