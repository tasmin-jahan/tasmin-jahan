<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&amp;display=swap');
      .bg { fill: #12141a; }
      .prompt { fill: #ff4fc3; }
      .path { fill: #00c8ff; }
      .name-hollow { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 34px; fill: none; stroke: #ff4fc3; stroke-width: 1px; }
      .role { font-family: 'JetBrains Mono', monospace; font-size: 15px; fill: #7a8499; }
      .comment { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #6b7280; }
      .cursor { fill: #ff4fc3; }
      .dot { fill: #ff4d6d; }
      .dot2 { fill: #ffb830; }
      .dot3 { fill: #ff4fc3; }
      .star { fill: none; stroke: #ff4fc3; stroke-width: 1px; stroke-linejoin: round; }

      #sweep { animation: sweep 5s ease-in-out infinite; }
      @keyframes sweep {
        0%   { transform: translateX(-260px); }
        100% { transform: translateX(900px); }
      }

      .starfade { animation: starfade 5s ease-in-out infinite; }
      @keyframes starfade {
        0%, 100% { opacity: 0.1; }
        50% { opacity: 0.55; }
      }
    </style>
    <linearGradient id="glowgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4fc3" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff4fc3" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff4fc3" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardclip">
      <rect width="900" height="220" rx="14"/>
    </clipPath>
  </defs>

  <rect class="bg" width="900" height="220" rx="14"/>
  <rect width="899" height="219" x="0.5" y="0.5" rx="14" fill="none" stroke="#222730"/>

  <g clip-path="url(#cardclip)">
    <g id="starrow">
      <polygon class="star starfade" style="animation-delay:0.0s" points="690.0,67.0 692.4,72.8 698.6,73.2 693.8,77.2 695.3,83.3 690.0,80.0 684.7,83.3 686.2,77.2 681.4,73.2 687.6,72.8"/>
